<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Quilt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="quilt">
    <!-- 24 tiles (20+ requirement met) -->
    <div class="tile a"></div>
    <div class="tile b tile--circle"></div>
    <div class="tile c tile--tall"></div>
    <div class="tile d tile--wide"></div>

    <div class="tile e tile--ring"></div>
    <div class="tile f"></div>
    <div class="tile g tile--wide"></div>
    <div class="tile h"></div>

    <div class="tile i tile--tall"></div>
    <div class="tile j tile--img"></div>
    <div class="tile k"></div>
    <div class="tile l tile--circle"></div>

    <div class="tile m"></div>
    <div class="tile n tile--wide"></div>
    <div class="tile o tile--ring"></div>
    <div class="tile p"></div>

    <div class="tile q tile--img"></div>
    <div class="tile r"></div>
    <div class="tile s tile--tall"></div>
    <div class="tile t tile--circle"></div>

    <div class="tile u"></div>
    <div class="tile v tile--wide"></div>
    <div class="tile w tile--ring"></div>
    <div class="tile x"></div>
  </main>
</body>
</html>
