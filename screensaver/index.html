<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Drift</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      font-family: Arial, sans-serif;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at center, #111 0%, #050505 50%, #000 100%);
      transition: background 1.2s ease, filter 1s ease;
      cursor: pointer;
    }

    .label {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.75);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: opacity 0.8s ease;
      text-align: center;
    }

    .sub {
      display: block;
      font-size: 0.8rem;
      margin-top: 10px;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      filter: blur(2px);
      transition: transform 0.8s ease, opacity 0.8s ease, background 0.8s ease;
      animation-play-state: paused;
    }

    .orb1 {
      width: 180px;
      height: 180px;
      background: cyan;
      top: 10%;
      left: 10%;
      animation: float1 10s linear infinite;
    }

    .orb2 {
      width: 120px;
      height: 120px;
      background: magenta;
      top: 65%;
      left: 20%;
      animation: float2 13s linear infinite;
    }

    .orb3 {
      width: 220px;
      height: 220px;
      background: lime;
      top: 20%;
      left: 70%;
      animation: float3 16s linear infinite;
    }

    .orb4 {
      width: 140px;
      height: 140px;
      background: orange;
      top: 70%;
      left: 75%;
      animation: float4 11s linear infinite;
    }

    .orb5 {
      width: 90px;
      height: 90px;
      background: hotpink;
      top: 40%;
      left: 45%;
      animation: float5 9s linear infinite;
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 280px;
      height: 280px;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      transition: border-color 0.8s ease, opacity 0.8s ease;
      opacity: 0.4;
      animation: spin 14s linear infinite;
      animation-play-state: paused;
    }

    .ring2 {
      width: 420px;
      height: 420px;
      animation-direction: reverse;
      animation-duration: 20s;
    }

    
    .screen:hover {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a16 45%, #000 100%);
      filter: saturate(1.3);
    }

    .screen:hover .label {
      opacity: 0;
    }

    .screen:hover .orb {
      opacity: 0.5;
      animation-play-state: running;
    }

    .screen:hover .ring {
      border-color: rgba(255,255,255,0.35);
      animation-play-state: running;
    }
    .screen:active .orb1 { animation-duration: 4s; }
    .screen:active .orb2 { animation-duration: 5s; }
    .screen:active .orb3 { animation-duration: 6s; }
    .screen:active .orb4 { animation-duration: 4.5s; }
    .screen:active .orb5 { animation-duration: 3.5s; }
    .screen:active .ring  { animation-duration: 5s; }
    .screen:active .ring2 { animation-duration: 7s; }

    @keyframes float1 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(250px, 80px) scale(1.2); }
      50%  { transform: translate(500px, 200px) scale(0.8); }
      75%  { transform: translate(200px, 350px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes float2 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(300px, -120px) scale(1.1); }
      50%  { transform: translate(600px, -40px) scale(0.9); }
      75%  { transform: translate(200px, -220px) scale(1.3); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes float3 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-220px, 100px) scale(0.9); }
      50%  { transform: translate(-500px, 280px) scale(1.2); }
      75%  { transform: translate(-150px, 420px) scale(1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes float4 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-300px, -160px) scale(1.2); }
      50%  { transform: translate(-500px, -350px) scale(0.8); }
      75%  { transform: translate(-120px, -220px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes float5 {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      25%  { transform: translate(180px, -150px) scale(1.4) rotate(90deg); }
      50%  { transform: translate(-120px, 180px) scale(0.7) rotate(180deg); }
      75%  { transform: translate(220px, 200px) scale(1.2) rotate(270deg); }
      100% { transform: translate(0, 0) scale(1) rotate(360deg); }
    }

    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="screen" tabindex="0">
    <div class="label">
      Neon Drift
      <span class="sub">Hover to activate • Click to speed up</span>
    </div>

    <div class="ring"></div>
    <div class="ring ring2"></div>

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <div class="orb orb5"></div>
  </div>
</body>
</html>
